name: Check BTC price

on:
  workflow_dispatch: {}
  # Best-effort only: GitHub throttles/delays frequent cron schedules on
  # low-traffic repos, so this does NOT reliably fire every 15 minutes —
  # see the commit message for detail. It's a bonus record when it does
  # fire, not something to depend on; use workflow_dispatch for a
  # guaranteed-fresh read.
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data

      - name: Fetch current BTC price from Binance (same source 가늠자 uses)
        run: |
          # api.binance.com 은 GitHub Actions 러너(미국 IP)에서 지역 차단(451)에 걸리므로,
          # 앱이 예비 경로로 쓰는 data-api.binance.vision(차단 없는 공개 시세 미러)을 먼저 쓴다.
          for host in "https://data-api.binance.vision" "https://api.binance.com"; do
            raw=$(curl -s "$host/api/v3/ticker/24hr?symbol=BTCUSDT")
            if echo "$raw" | jq -e '.lastPrice' > /dev/null 2>&1; then
              echo "$raw" | jq '{price: (.lastPrice | tonumber), change24hPct: (.priceChangePercent | tonumber), fetchedAt: now | todate}' > data.json
              cat data.json
              exit 0
            fi
            echo "실패($host): $raw" >&2
          done
          echo "모든 호스트에서 가격 조회 실패" >&2
          exit 1

      - name: Commit result to data branch
        run: |
          git config user.name "btc-price-bot"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "Update BTC price $(date -u +%FT%TZ)" || echo "No changes to commit"
          git push origin data
